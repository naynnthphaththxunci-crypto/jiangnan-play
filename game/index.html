<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>江南合成</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        background: #1a1410;
        overflow: hidden;
        position: fixed;
        inset: 0;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        font-family: "WenQuanYi Micro Hei", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      #app {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        padding:
          env(safe-area-inset-top)
          env(safe-area-inset-right)
          env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        touch-action: none;
      }
      canvas {
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        background: #f4ead8;
        display: block;
        max-width: 100%;
        max-height: 100%;
      }
      canvas.is-booting {
        visibility: hidden;
      }
      #boot {
        position: absolute;
        z-index: 5;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        height: 100%;
        max-width: 100%;
        max-height: 100%;
        aspect-ratio: 390 / 844;
        width: auto;
        overflow: hidden;
        background: #2a1c14 center / cover no-repeat;
        transition: opacity 0.28s ease;
      }
      #boot.is-done {
        opacity: 0;
        pointer-events: none;
      }
      .boot-panel {
        position: absolute;
        left: 12%;
        right: 12%;
        bottom: 3.4%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .boot-caption {
        margin: 0;
        padding: 3px 14px 4px;
        border-radius: 999px;
        background: rgba(62, 34, 18, 0.62);
        border: 1px solid rgba(240, 210, 160, 0.55);
        color: #fff6e6;
        font-size: 13px;
        letter-spacing: 0.32em;
        text-indent: 0.32em;
        line-height: 1.7;
      }
      .boot-track {
        position: relative;
        width: 100%;
        height: 16px;
        border-radius: 999px;
        background: rgba(48, 28, 16, 0.72);
        border: 2px solid #f0d7a2;
        overflow: hidden;
      }
      .boot-fill {
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(180deg, #ffe7b0 0%, #f0a24a 46%, #d36a2c 100%);
      }
      .boot-pct {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff8ec;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-shadow: 0 1px 1px rgba(40, 18, 8, 0.85);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game" class="is-booting"></canvas>
      <div id="boot">
        <div class="boot-panel">
          <p class="boot-caption">客栈备席</p>
          <div class="boot-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="客栈备席">
            <div class="boot-fill"></div>
            <span class="boot-pct">0%</span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
